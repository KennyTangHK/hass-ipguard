name: Publish release
run-name: Publish ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate the selected release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Prepare and validate the selected release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 .github/workflows/release_metadata.py \
            --prepare --tag "$RELEASE_TAG" --ref-type "$RELEASE_REF_TYPE"

  checks:
    name: Validate and build this tag
    needs: preflight
    uses: ./.github/workflows/checks.yml
    with:
      expected-tag: ${{ github.ref_name }}
    permissions:
      contents: read

  publish:
    name: Publish the checked release assets
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Download assets built and tested in this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.checks.outputs.artifact-name }}
          path: dist
          digest-mismatch: error
      - name: Prepare metadata and verify assets and checksums before publishing
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 .github/workflows/release_metadata.py \
            --prepare --tag "$RELEASE_TAG" --dist dist
      - name: Validate the pinned draft, reuse or upload assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
          TESTED_SHA: ${{ needs.checks.outputs.tested-commit }}
        run: |
          python3 .github/workflows/release_publish.py \
            --tag "$RELEASE_TAG" --repo "$GH_REPO" \
            --event-sha "$EVENT_SHA" --tested-sha "$TESTED_SHA" \
            --dist dist --notes-file release-notes.md
